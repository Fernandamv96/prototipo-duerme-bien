{# Fecha escrita a mano (DD-MM-AAAA) con un botón que abre el calendario del navegador. #}
<div class="db-fecha">
  <input class="form-control" id="{{ id }}" name="{{ name }}" value="{{ valor }}" placeholder="dd-mm-aaaa" inputmode="numeric"
         pattern="\d{2}-\d{2}-\d{4}" maxlength="10" autocomplete="off" required data-fecha title="Escriba la fecha como dd-mm-aaaa">
  <button type="button" class="db-fecha-btn" aria-label="Elegir {{ label|lower }} en el calendario" data-fecha-btn>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3zm12 8H5v9h14zM5 6v2h14V6z"/></svg>
  </button>
  <input type="date" class="db-fecha-picker" tabindex="-1" aria-hidden="true" data-fecha-picker>
</div>
